
name: Build AutoArmadillo

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Zbuduj moda
        run: |
          mv kompilacja.gradle build.gradle
          mv ustawienia.gradle settings.gradle
          gradle build

      - name: Udostępnij plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoArmadillo-1.21.4
          path: build/libs/*.jar
